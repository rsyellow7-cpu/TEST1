<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RS FLAGS - Chat App</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Orbitron:wght@700&family=Press+Start+2P&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', 'Consolas', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: #06020c; color: #ffffff; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; height: 100vh; height: 100dvh; overflow: hidden; position: relative; }
        #matrix-bg, #spiders-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        #matrix-bg { opacity: 0.2; }
        #spiders-bg { z-index: 1; }

        /* AKIRA YS HEADER */
        .akira-header {
            z-index: 15;
            width: 100%;
            background: linear-gradient(90deg, rgba(10, 4, 18, 0.95), rgba(30, 10, 50, 0.95), rgba(10, 4, 18, 0.95));
            border-bottom: 2px solid #b15eff;
            text-align: center;
            padding: 8px 0;
            box-shadow: 0 0 15px rgba(177, 94, 255, 0.4);
            flex-shrink: 0;
        }
        .akira-text {
            font-size: 0.9em;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 5px #b15eff, 0 0 10px #ff5ed1;
        }
        .akira-text span.ys-effect {
            background: linear-gradient(45deg, #b15eff, #ff5ed1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: ysGlow 2s infinite alternate;
        }
        @keyframes ysGlow {
            0% { filter: drop-shadow(0 0 2px #b15eff); }
            100% { filter: drop-shadow(0 0 8px #ff5ed1); }
        }

        #auth-screen { z-index: 10; background: rgba(18, 8, 33, 0.95); padding: 30px 20px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; border: 1px solid #b15eff; box-shadow: 0 0 25px rgba(177, 94, 255, 0.35); margin-top: auto; margin-bottom: auto; }
        #auth-screen input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ff5ed1; border-radius: 6px; background: #0a0412; color: #fff; outline: none; font-size: 16px; }
        #auth-screen button { width: 48%; padding: 12px; border: 1px solid #b15eff; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; background: #2a0845; color: #ffffff; text-shadow: 0 0 5px #ff5ed1; font-size: 15px; }

        #chat-screen { display: none; z-index: 10; width: 100vw; height: calc(100vh - 36px); height: calc(100dvh - 36px); background: rgba(15, 6, 28, 0.94); border: 1px solid #b15eff; border-radius: 0; overflow: hidden; flex-direction: row; box-shadow: 0 0 45px rgba(255, 94, 209, 0.3); position: relative; }
        
        @media (min-width: 769px) {
            #chat-screen { width: 98vw; max-width: 1400px; height: calc(94vh - 36px); border-radius: 12px; margin-bottom: auto; }
        }

        #sidebar { width: 320px; background: rgba(22, 10, 40, 0.95); border-right: 1px solid #3c125d; padding: 15px; display: flex; flex-direction: column; z-index: 20; flex-shrink: 0; transition: transform 0.3s ease; }
        
        @media (max-width: 768px) {
            #sidebar { position: absolute; left: 0; top: 0; bottom: 0; width: 280px; transform: translateX(-100%); box-shadow: 5px 0 25px rgba(0,0,0,0.8); z-index: 30; }
            #sidebar.open { transform: translateX(0); }
        }

        .mobile-header { display: none; background: #120624; border-bottom: 1px solid #3c125d; padding: 10px 14px; justify-content: space-between; align-items: center; z-index: 15; }
        @media (max-width: 768px) {
            .mobile-header { display: flex; }
        }

        .brand-logo { font-size: 1.3em; font-weight: 900; letter-spacing: 2px; text-align: center; border-bottom: 1px dashed #b15eff; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .logo-y { color: #b15eff; text-shadow: 0 0 12px #b15eff; }
        .logo-s { color: #ff5ed1; text-shadow: 0 0 12px #ff5ed1; }

        .my-profile-box { display: flex; flex-direction: column; gap: 6px; padding: 10px; background: rgba(35, 14, 61, 0.6); border: 1px solid #5a1b8e; border-radius: 8px; margin-bottom: 12px; position: relative; }
        .profile-row { display: flex; align-items: center; gap: 10px; }
        .avatar-container { position: relative; width: 44px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; }
        .avatar-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1px solid #ff5ed1; background: #120624; }
        
        .role-badge { display: inline-block; background: #ff5ed1; color: #0a0412; font-size: 0.65em; font-weight: bold; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; margin-left: 4px; }
        .role-owner { background: #ffd700; color: #000; }

        .bio-text { font-size: 0.75em; color: #d0a3ff; font-style: italic; margin-top: 4px; border-top: 1px dashed #3c125d; padding-top: 4px; word-break: break-word; }

        #chat-tabs-bar { display: flex; background: #120624; border-bottom: 1px solid #3c125d; padding: 6px 10px 0 10px; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .chat-tab { padding: 8px 14px; background: #1c0b36; border: 1px solid #3c125d; border-bottom: none; border-radius: 8px 8px 0 0; color: #d0a3ff; font-size: 0.85em; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; flex-shrink: 0; }
        .chat-tab.active { background: #2a0845; border-color: #b15eff; color: #ffffff; font-weight: bold; box-shadow: 0 -2px 10px rgba(177, 94, 255, 0.3); }
        .chat-tab .unread-dot { width: 8px; height: 8px; background: #ff5ed1; border-radius: 50%; display: none; }
        .chat-tab.has-unread .unread-dot { display: inline-block; }
        .tab-close { font-size: 0.9em; opacity: 0.6; cursor: pointer; }

        #chat-main { flex: 1; display: flex; flex-direction: column; background: rgba(10, 4, 18, 0.75); width: 100%; height: 100%; position: relative; overflow: hidden; }
        .messages-container { flex: 1; padding: 15px; overflow-y: auto; display: none; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
        .messages-container.active { display: flex; }

        .msg { background: rgba(35, 14, 61, 0.75); padding: 10px 12px; border-radius: 8px; border: 1px solid #5a1b8e; max-width: 85%; word-break: break-word; color: #ffffff; display: flex; gap: 10px; position: relative; transition: all 0.2s ease; }
        @media (max-width: 768px) { .msg { max-width: 92%; } }
        .msg:hover .msg-delete-btn { display: flex; }
        .msg-body { flex: 1; min-width: 0; }
        .msg .author { font-weight: bold; font-size: 0.85em; margin-bottom: 4px; color: #ff5ed1; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        
        .msg-delete-btn { display: none; background: rgba(255, 42, 133, 0.2); border: 1px solid #ff2a85; color: #ff2a85; border-radius: 4px; font-size: 0.7em; padding: 2px 6px; cursor: pointer; align-items: center; justify-content: center; }
        
        .user-item { padding: 8px 10px; border-bottom: 1px solid #2a0845; font-size: 0.85em; color: #d0a3ff; display: flex; flex-direction: column; gap: 4px; cursor: pointer; border-radius: 6px; transition: background 0.2s; }
        .user-item:hover { background: rgba(177, 94, 255, 0.15); }

        .msg-images-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin-top: 8px; max-width: 400px; }
        .chat-img-thumb { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; border: 1px solid #b15eff; cursor: pointer; }
        .chat-media-video { width: 100%; max-width: 360px; border-radius: 8px; border: 1px solid #b15eff; margin-top: 8px; }
        .chat-media-audio { width: 100%; max-width: 300px; margin-top: 8px; outline: none; }

        .spider-badge-msg { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #e60026, #0055ff); padding: 8px 14px; border-radius: 20px; font-weight: bold; color: #fff; margin-top: 6px; box-shadow: 0 0 12px rgba(255, 0, 50, 0.6); border: 1px solid #ffffff; }
        .spidergwen-badge-msg { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #ff007f, #00f0ff); padding: 8px 14px; border-radius: 20px; font-weight: bold; color: #fff; margin-top: 6px; box-shadow: 0 0 12px rgba(255, 0, 200, 0.6); border: 1px solid #ffffff; }

        #media-preview-bar { display: none; padding: 8px 12px; background: rgba(22, 10, 40, 0.95); border-top: 1px solid #3c125d; gap: 10px; overflow-x: auto; align-items: center; }
        .preview-thumb-box { position: relative; width: 50px; height: 50px; flex-shrink: 0; }
        .preview-thumb-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid #ff5ed1; }
        .preview-remove-btn { position: absolute; top: -6px; right: -6px; background: #ff2a85; color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; cursor: pointer; font-weight: bold; }

        #input-area { display: flex; padding: 10px; background: rgba(22, 10, 40, 0.95); gap: 6px; align-items: center; border-top: 1px solid #3c125d; }
        #input-area input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #b15eff; background: #0a0412; color: #ffffff; outline: none; font-size: 15px; }
        .action-icon-btn { background: #2a0845; border: 1px solid #b15eff; color: #ff5ed1; border-radius: 50%; width: 38px; height: 38px; font-size: 1.1em; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .action-icon-btn.recording { background: #ff2a85; color: #ffffff; border-color: #ff2a85; animation: pulse 1s infinite; }

        .font-normal { font-family: inherit; }
        .font-cyber { font-family: 'Orbitron', sans-serif; color: #00ffff !important; text-shadow: 0 0 8px #00ffff; }
        .font-horror { font-family: 'Creepster', cursive; font-size: 1.15em; color: #ff0055 !important; }
        .font-retro { font-family: 'Press Start 2P', monospace; font-size: 0.75em; color: #00ff66 !important; }
        .font-glow { font-family: 'Sacramento', cursive; font-size: 1.3em; color: #ffd700 !important; }

        .dp-effect-none { border-radius: 50%; border: 1px solid #ff5ed1; }
        .dp-effect-neon { border-radius: 50%; border: 2px solid #00ffff; box-shadow: 0 0 12px #00ffff; }
        .dp-effect-gold { border-radius: 50%; border: 2px solid #ffd700; box-shadow: 0 0 15px #ffd700; }
        .dp-effect-pulse { border-radius: 50%; border: 2px solid #ff5ed1; animation: dpPulse 1.5s infinite alternate; }
        .dp-effect-glitch { border-radius: 20%; border: 2px solid #ff2a85; box-shadow: -3px 0 #00ffff, 3px 0 #ff00ff; }
        .dp-effect-dragon { border-radius: 50%; border: 2px dashed #ff4500; box-shadow: 0 0 15px #ff4500; animation: dragonRotate 4s linear infinite; }
        .dp-effect-portal { border-radius: 50%; border: 2px solid #9400d3; box-shadow: 0 0 25px #4b0082; animation: dpPulse 1s infinite alternate; }

        @keyframes dpPulse { 0% { transform: scale(0.98); } 100% { transform: scale(1.05); } }
        @keyframes dragonRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #profile-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 99; justify-content: center; align-items: center; }
        .modal-content { background: #160a28; border: 1px solid #b15eff; border-radius: 12px; width: 90%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .modal-field { display: flex; flex-direction: column; gap: 4px; }
        .modal-field label { font-size: 0.8em; color: #b15eff; font-weight: bold; }
        .modal-field input, .modal-field select, .modal-field textarea { background: #0a0412; border: 1px solid #ff5ed1; border-radius: 6px; padding: 8px; color: #fff; outline: none; font-size: 14px; }
    </style>
</head>
<body>
    <canvas id="matrix-bg"></canvas>
    <canvas id="spiders-bg"></canvas>

    <!-- HEADER BANNER -->
    <div class="akira-header">
        <div class="akira-text">Created by <span class="ys-effect">Akira</span></div>
    </div>

    <div id="auth-screen">
        <div class="brand-logo" style="justify-content: center;"><span class="logo-y">Y</span><span class="logo-s">S</span></div>
        <p style="font-size: 0.8em; color: #b15eff; margin: 8px 0 15px 0;">RS FLAGS CHAT</p>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <div style="display: flex; justify-content: space-between; margin-top: 10px;">
            <button onclick="auth('login')">Log In</button>
            <button onclick="auth('register')">Register</button>
        </div>
        <p id="auth-err" style="color: #ff5ed1; font-size: 0.8em; margin-top: 10px;"></p>
    </div>

    <div id="chat-screen">
        <div id="sidebar">
            <div class="brand-logo"><span><span class="logo-y">Y</span><span class="logo-s">S</span> FLAGS</span></div>
            
            <div class="my-profile-box">
                <div class="profile-row">
                    <div class="avatar-container">
                        <img id="my-avatar" class="avatar-img dp-effect-none" src="">
                    </div>
                    <div style="flex: 1; min-width: 0;">
                        <div id="my-display-name" class="font-normal" style="font-weight:bold; font-size:0.9em; color:#ffffff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Guest</div>
                        <div id="my-username" style="font-size:0.75em; color:#b15eff;">@guest</div>
                        <span id="my-role" class="role-badge">MEMBER</span>
                    </div>
                    <button class="btn-mini" style="background:#2a0845; border:1px solid #b15eff; color:#ff5ed1; padding:3px 8px; border-radius:4px; font-size:0.75em; cursor:pointer;" onclick="openProfileModal()">✏️ Edit</button>
                </div>
                <div id="my-bio" class="bio-text">Bio: Hey there!</div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin: 5px 0;">
                <p style="font-size: 0.8em; color: #b15eff;">ONLINE USERS (Tap to DM)</p>
                <button style="background:#ff2a85; border:none; color:#fff; font-size:0.7em; padding:4px 8px; border-radius:4px; cursor:pointer;" onclick="logout()">Logout</button>
            </div>
            <div id="online-list" style="flex: 1; overflow-y: auto;"></div>
        </div>

        <div id="chat-main">
            <div class="mobile-header">
                <button onclick="toggleSidebar()" style="background:#2a0845; border:1px solid #b15eff; color:#fff; padding:6px 12px; border-radius:6px; font-weight:bold;">👥 Users</button>
                <div style="font-weight:bold; color:#ff5ed1; font-size:0.9em;">RS FLAGS</div>
            </div>

            <div id="chat-tabs-bar">
                <div class="chat-tab active" id="tab-global" onclick="switchTab('global')">
                    🌐 Global Chat
                    <span class="unread-dot"></span>
                </div>
            </div>

            <div id="messages-global" class="messages-container active"></div>
            <div id="media-preview-bar"></div>
            
            <div id="input-area">
                <input type="file" id="multi-image-input" accept="image/*" multiple style="display:none;" onchange="handleImagesSelected(event)">
                <button class="action-icon-btn" onclick="document.getElementById('multi-image-input').click()" title="Attach Images">🖼️</button>

                <input type="file" id="video-input" accept="video/*" style="display:none;" onchange="handleVideoSelect(event)">
                <button class="action-icon-btn" onclick="document.getElementById('video-input').click()" title="Attach Video">🎥</button>

                <button class="action-icon-btn" onclick="sendSpiderBadge('spiderman')" title="Send Spider-Man">🕷️</button>
                <button class="action-icon-btn" onclick="sendSpiderBadge('spidergirl')" title="Send Spider-Gwen / Spider-Girl">🕸️</button>

                <button id="mic-btn" class="action-icon-btn" onclick="toggleVoiceRecording()" title="Record Voice Message">🎤</button>

                <input type="text" id="msg-input" placeholder="Type a message..." onkeydown="if(event.key === 'Enter') sendMsg()">
                <button style="background: #2a0845; border: 1px solid #ff5ed1; padding: 10px 16px; color: #ffffff; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; flex-shrink: 0;" onclick="sendMsg()">Send</button>
            </div>
        </div>
    </div>

    <div id="profile-modal">
        <div class="modal-content">
            <h3 style="color:#ff5ed1; text-align:center;">Custom Profile</h3>

            <div class="modal-field">
                <label>Display Name</label>
                <input type="text" id="edit-display-name" placeholder="Enter new display name">
            </div>

            <div class="modal-field">
                <label>Display Name Font Style</label>
                <select id="edit-font-style">
                    <option value="font-normal">Default Standard</option>
                    <option value="font-cyber">⚡ Cyberpunk Neon (Orbitron)</option>
                    <option value="font-horror">🩸 Gothic Horror (Creepster)</option>
                    <option value="font-retro">👾 8-Bit Arcade (Press Start)</option>
                    <option value="font-glow">✨ Handwritten Cursive (Sacramento)</option>
                </select>
            </div>

            <div class="modal-field">
                <label>Avatar / DP Image</label>
                <input type="file" id="edit-dp-file" accept="image/*" onchange="handleDpUpload(event)">
            </div>

            <div class="modal-field">
                <label>DP Frame / Visual Effect</label>
                <select id="edit-dp-effect">
                    <option value="dp-effect-none">Classic Circle (None)</option>
                    <option value="dp-effect-neon">Cyber Neon Glow</option>
                    <option value="dp-effect-gold">Gold Aura</option>
                    <option value="dp-effect-pulse">Pulse Wave</option>
                    <option value="dp-effect-glitch">Cyber Glitch Box</option>
                    <option value="dp-effect-dragon">🔥 Dragon Flame Ring</option>
                    <option value="dp-effect-portal">🔮 Void Black Hole Portal</option>
                </select>
            </div>

            <div class="modal-field">
                <label>Bio</label>
                <textarea id="edit-bio" rows="2" placeholder="Write a short bio..."></textarea>
            </div>

            <div style="display:flex; justify-content:space-between; gap:10px; margin-top:8px;">
                <button style="flex:1; padding:8px; border-radius:6px; background:#120624; border:1px solid #ff5ed1; color:#ff5ed1; font-weight:bold; cursor:pointer;" onclick="closeProfileModal()">Cancel</button>
                <button style="flex:1; padding:8px; border-radius:6px; background:#2a0845; border:1px solid #b15eff; color:#fff; font-weight:bold; cursor:pointer;" onclick="saveProfileModal()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23b15eff'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let drops = Array(Math.floor(canvas.width / 15)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(6, 2, 12, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 15px monospace';
            ctx.fillStyle = '#ff5ed1';
            for (let i = 0; i < drops.length; i++) {
                ctx.fillText('YS', i * 15, drops[i] * 15);
                if (drops[i] * 15 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        const sCanvas = document.getElementById('spiders-bg');
        const sCtx = sCanvas.getContext('2d');
        sCanvas.width = window.innerWidth; sCanvas.height = window.innerHeight;

        class Spider {
            constructor(type = 'normal') {
                this.x = Math.random() * sCanvas.width;
                this.y = Math.random() * sCanvas.height;
                this.size = Math.random() * 6 + 6;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.legAngle = 0;
                this.type = type;
            }
            update() {
                this.x += this.vx; this.y += this.vy; this.legAngle += 0.2;
                if (this.x < 0 || this.x > sCanvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > sCanvas.height) this.vy *= -1;
            }
            draw() {
                sCtx.strokeStyle = 'rgba(177, 94, 255, 0.15)';
                sCtx.beginPath(); sCtx.moveTo(this.x, 0); sCtx.lineTo(this.x, this.y); sCtx.stroke();

                sCtx.fillStyle = this.type === 'spiderman' ? '#ff0033' : (this.type === 'spidergirl' ? '#ff00a0' : '#ff5ed1');
                sCtx.beginPath(); sCtx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2); sCtx.fill();

                sCtx.strokeStyle = this.type === 'spiderman' ? '#0066ff' : (this.type === 'spidergirl' ? '#00e5ff' : '#b15eff');
                sCtx.lineWidth = 1.5;
                for (let i = 0; i < 8; i++) {
                    let angle = (i * Math.PI / 4) + Math.sin(this.legAngle) * 0.3;
                    sCtx.beginPath(); sCtx.moveTo(this.x, this.y);
                    sCtx.lineTo(this.x + Math.cos(angle) * (this.size + 4), this.y + Math.sin(angle) * (this.size + 4));
                    sCtx.stroke();
                }
            }
        }

        const spiders = [
            ...Array.from({ length: 8 }, () => new Spider('normal')),
            new Spider('spiderman'), new Spider('spiderman'),
            new Spider('spidergirl'), new Spider('spidergirl')
        ];

        function animateSpiders() {
            sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);
            spiders.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animateSpiders);
        }
        animateSpiders();

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        const socket = io();
        let currentUser = null;
        let activeTab = 'global';
        let pendingImages = [];
        let pendingVideoBase64 = null;
        let pendingAvatarBase64 = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        window.addEventListener('load', () => {
            const savedUser = localStorage.getItem('rs_chat_user');
            const savedPass = localStorage.getItem('rs_chat_pass');
            if (savedUser && savedPass) {
                document.getElementById('username').value = savedUser;
                document.getElementById('password').value = savedPass;
                auth('login');
            }
        });

        function auth(action) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (username && password) socket.emit('authenticate', { username, password, action });
        }

        function logout() {
            localStorage.removeItem('rs_chat_user'); localStorage.removeItem('rs_chat_pass'); location.reload();
        }

        socket.on('auth_error', (msg) => document.getElementById('auth-err').innerText = msg);

        socket.on('auth_success', (user) => {
            currentUser = user;
            localStorage.setItem('rs_chat_user', document.getElementById('username').value.trim());
            localStorage.setItem('rs_chat_pass', document.getElementById('password').value.trim());

            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            updateMyProfileDisplay(user);
        });

        function updateMyProfileDisplay(user) {
            const nameEl = document.getElementById('my-display-name');
            nameEl.innerText = user.displayName;
            nameEl.className = user.fontStyle || 'font-normal';
            document.getElementById('my-username').innerText = `@${user.username}`;
            
            const avatarImg = document.getElementById('my-avatar');
            avatarImg.src = user.avatar || DEFAULT_AVATAR;
            avatarImg.className = `avatar-img ${user.dpEffect || 'dp-effect-none'}`;
            
            const roleBadge = document.getElementById('my-role');
            roleBadge.innerText = user.role;
            if (user.role === 'OWNER') roleBadge.classList.add('role-owner');
            document.getElementById('my-bio').innerText = user.bio ? `Bio: ${user.bio}` : 'No bio set...';
        }

        socket.on('kicked', () => { alert('You were kicked from the server.'); logout(); });

        function switchTab(tabId) {
            activeTab = tabId;
            document.querySelectorAll('.chat-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.messages-container').forEach(c => c.classList.remove('active'));

            const targetTab = document.getElementById(`tab-${tabId}`);
            if (targetTab) { targetTab.classList.add('active'); targetTab.classList.remove('has-unread'); }

            const targetContainer = document.getElementById(`messages-${tabId}`);
            if (targetContainer) { targetContainer.classList.add('active'); targetContainer.scrollTop = targetContainer.scrollHeight; }

            if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        function openPrivateChat(username, displayName) {
            if (username === currentUser.username) return;

            const tabId = `dm_${username}`;
            if (!document.getElementById(`tab-${tabId}`)) {
                const tabsBar = document.getElementById('chat-tabs-bar');
                const tab = document.createElement('div');
                tab.className = 'chat-tab'; tab.id = `tab-${tabId}`;
                tab.onclick = () => switchTab(tabId);
                tab.innerHTML = `💬 ${displayName} <span class="unread-dot"></span> <span class="tab-close" onclick="closeTab(event, '${tabId}')">✕</span>`;
                tabsBar.appendChild(tab);

                const main = document.getElementById('chat-main');
                const container = document.createElement('div');
                container.className = 'messages-container'; container.id = `messages-${tabId}`;
                main.insertBefore(container, document.getElementById('media-preview-bar'));
            }
            switchTab(tabId);
        }

        function closeTab(event, tabId) {
            event.stopPropagation();
            const tab = document.getElementById(`tab-${tabId}`);
            const container = document.getElementById(`messages-${tabId}`);
            if (tab) tab.remove();
            if (container) container.remove();
            if (activeTab === tabId) switchTab('global');
        }

        function openProfileModal() {
            if (!currentUser) return;
            document.getElementById('edit-display-name').value = currentUser.displayName || '';
            document.getElementById('edit-bio').value = currentUser.bio || '';
            document.getElementById('edit-dp-effect').value = currentUser.dpEffect || 'dp-effect-none';
            document.getElementById('edit-font-style').value = currentUser.fontStyle || 'font-normal';
            pendingAvatarBase64 = null;
            document.getElementById('profile-modal').style.display = 'flex';
        }
        function closeProfileModal() { document.getElementById('profile-modal').style.display = 'none'; }

        function handleDpUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            compressImage(file, 300, 0.8).then(base64 => { pendingAvatarBase64 = base64; });
        }

        function saveProfileModal() {
            const newName = document.getElementById('edit-display-name').value.trim();
            const payload = {
                displayName: newName || currentUser.username,
                bio: document.getElementById('edit-bio').value.trim(),
                dpEffect: document.getElementById('edit-dp-effect').value,
                fontStyle: document.getElementById('edit-font-style').value
            };
            if (pendingAvatarBase64) payload.avatar = pendingAvatarBase64;
            socket.emit('update_profile', payload);
            closeProfileModal();
        }

        socket.on('profile_updated', (data) => {
            if (currentUser && data.username === currentUser.username) {
                currentUser.displayName = data.displayName;
                currentUser.avatar = data.avatar;
                currentUser.bio = data.bio;
                currentUser.dpEffect = data.dpEffect;
                currentUser.fontStyle = data.fontStyle;
                updateMyProfileDisplay(currentUser);
            }
        });

        socket.on('update_online_list', (usersList) => {
            const list = document.getElementById('online-list');
            list.innerHTML = '';
            usersList.forEach(u => {
                if (currentUser && u.username === currentUser.username) return;
                
                const div = document.createElement('div');
                div.className = 'user-item';
                div.onclick = () => openPrivateChat(u.username, u.displayName || u.username);

                let roleBadgeClass = u.role === 'OWNER' ? 'role-badge role-owner' : 'role-badge';
                let fontClass = u.fontStyle || 'font-normal';

                let ownerButtons = '';
                if (currentUser && currentUser.role === 'OWNER' && u.role !== 'OWNER') {
                    ownerButtons = `
                    <div style="display:flex; gap:4px; margin-top:4px;" onclick="event.stopPropagation()">
                        <button style="background:#2a0845; border:1px solid #b15eff; color:#ff5ed1; font-size:0.7em; padding:2px 6px; border-radius:4px;" onclick="assignRole('${u.username}')">Role</button>
                        <button style="background:#2a0845; border:1px solid #ff2a85; color:#ff2a85; font-size:0.7em; padding:2px 6px; border-radius:4px;" onclick="kickUser('${u.username}')">Kick</button>
                    </div>`;
                }

                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:8px;">
                        <img class="avatar-img ${u.dpEffect || 'dp-effect-none'}" style="width:28px; height:28px;" src="${u.avatar || DEFAULT_AVATAR}">
                        <div><strong class="${fontClass}">${u.displayName || u.username}</strong> <span class="${roleBadgeClass}">${u.role}</span></div>
                    </div>
                    <div style="font-size:0.75em; color:#a080c0; padding-left:36px;">${u.bio || 'No bio set'}</div>
                    ${ownerButtons}`;
                list.appendChild(div);
            });
        });

        function kickUser(targetUser) { if (confirm(`Kick ${targetUser}?`)) socket.emit('kick_user', targetUser); }
        function assignRole(targetUser) {
            const r = prompt(`Role for ${targetUser}:`, "MODERATOR");
            if (r) socket.emit('assign_role', { targetUsername: targetUser, newRole: r.trim().toUpperCase() });
        }

        function compressImage(file, maxWidth = 1000, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        async function handleImagesSelected(event) {
            const files = Array.from(event.target.files); if (!files.length) return;
            const compressed = await Promise.all(files.map(f => compressImage(f)));
            pendingImages.push(...compressed); renderMediaPreviewBar(); event.target.value = '';
        }

        function handleVideoSelect(event) {
            const file = event.target.files[0]; if (!file) return;
            if (file.size > 30 * 1024 * 1024) return alert("Select video under 30MB.");
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = () => { pendingVideoBase64 = reader.result; renderMediaPreviewBar(); };
            event.target.value = '';
        }

        async function toggleVoiceRecording() {
            const micBtn = document.getElementById('mic-btn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream); audioChunks = [];
                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader(); reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => sendMsgPayload({ audio: reader.result });
                        stream.getTracks().forEach(track => track.stop());
                    };
                    mediaRecorder.start(); isRecording = true; micBtn.classList.add('recording');
                } catch (err) { alert("Microphone access denied."); }
            } else { mediaRecorder.stop(); isRecording = false; micBtn.classList.remove('recording'); }
        }

        function renderMediaPreviewBar() {
            const bar = document.getElementById('media-preview-bar');
            if (pendingImages.length === 0 && !pendingVideoBase64) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
            bar.style.display = 'flex';
            let html = '';
            pendingImages.forEach((imgSrc, idx) => { html += `<div class="preview-thumb-box"><img src="${imgSrc}"><button class="preview-remove-btn" onclick="pendingImages.splice(${idx},1);renderMediaPreviewBar();">✕</button></div>`; });
            if (pendingVideoBase64) html += `<div style="background:#ff5ed1; color:#000; padding:4px 10px; border-radius:12px; font-weight:bold; font-size:0.8em;">🎥 Video Attached <span style="cursor:pointer;" onclick="pendingVideoBase64=null;renderMediaPreviewBar();">✕</span></div>`;
            bar.innerHTML = html;
        }

        function sendSpiderBadge(type) { sendMsgPayload({ spiderSticker: type }); }

        function deleteMsg(msgId, authorUsername, isPrivate, recipientUsername) {
            if (confirm("Delete this message?")) socket.emit('delete_message', { messageId: msgId, authorUsername, isPrivate, recipientUsername });
        }

        socket.on('message_deleted', (msgId) => {
            const el = document.getElementById(msgId);
            if (el) { el.style.opacity = '0'; setTimeout(() => el.remove(), 200); }
        });

        function renderMessage(data, targetContainerId, isPrivate = false, recipientUsername = '') {
            const msgBox = document.getElementById(targetContainerId); if (!msgBox) return;

            const div = document.createElement('div'); div.className = 'msg'; div.id = data.id;

            let mediaContent = '';
            if (data.images && data.images.length > 0) {
                mediaContent += `<div class="msg-images-grid">` + data.images.map(imgSrc => `<img class="chat-img-thumb" src="${imgSrc}" onclick="window.open(this.src)">`).join('') + `</div>`;
            }
            if (data.audio) mediaContent += `<div><audio class="chat-media-audio" src="${data.audio}" controls></audio></div>`;
            if (data.video) mediaContent += `<div><video class="chat-media-video" src="${data.video}" controls></video></div>`;
            
            if (data.spiderSticker === 'spiderman') {
                mediaContent += `<div><div class="spider-badge-msg">🕷️ Spider-Man Web Blast!</div></div>`;
            } else if (data.spiderSticker === 'spidergirl') {
                mediaContent += `<div><div class="spidergwen-badge-msg">🕸️ Spider-Gwen Ghost Web!</div></div>`;
            }

            let roleBadgeClass = data.role === 'OWNER' ? 'role-badge role-owner' : 'role-badge';
            let fontClass = data.fontStyle || 'font-normal';

            let deleteBtnHtml = '';
            if (currentUser && (currentUser.username === (data.username || data.senderUsername) || currentUser.role === 'OWNER')) {
                deleteBtnHtml = `<button class="msg-delete-btn" onclick="deleteMsg('${data.id}', '${data.username || data.senderUsername}', ${isPrivate}, '${recipientUsername}')">🗑️</button>`;
            }

            div.innerHTML = `
                <img class="avatar-img ${data.dpEffect || 'dp-effect-none'}" src="${data.avatar || DEFAULT_AVATAR}">
                <div class="msg-body">
                    <div class="author">
                        <span class="${fontClass}">${data.displayName} <span class="${roleBadgeClass}">${data.role}</span></span>
                        <div style="display:flex; align-items:center; gap:6px;">
                            ${deleteBtnHtml}
                            <span style="font-weight:normal; font-size:0.75em; color:#b15eff">${data.time}</span>
                        </div>
                    </div>
                    ${data.text ? `<div>${data.text}</div>` : ''}
                    ${mediaContent}
                </div>`;

            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        socket.on('receive_message', (data) => {
            renderMessage(data, 'messages-global');
            if (activeTab !== 'global') { const t = document.getElementById('tab-global'); if (t) t.classList.add('has-unread'); }
        });

        socket.on('receive_private_message', (data) => {
            const isMeSender = data.senderUsername === currentUser.username;
            const otherUser = isMeSender ? data.recipientUsername : data.senderUsername;
            const otherDisplayName = isMeSender ? data.recipientUsername : data.displayName;

            openPrivateChat(otherUser, otherDisplayName);
            const tabId = `dm_${otherUser}`;
            renderMessage(data, `messages-${tabId}`, true, otherUser);

            if (activeTab !== tabId) { const t = document.getElementById(`tab-${tabId}`); if (t) t.classList.add('has-unread'); }
        });

        function sendMsgPayload(extraData = {}) {
            if (activeTab === 'global') {
                socket.emit('send_message', extraData);
            } else {
                const recipientUsername = activeTab.replace('dm_', '');
                socket.emit('send_private_message', { recipientUsername, ...extraData });
            }
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();

            if (text || pendingImages.length > 0 || pendingVideoBase64) {
                sendMsgPayload({ text, images: pendingImages, video: pendingVideoBase64 });
                input.value = ''; pendingImages = []; pendingVideoBase64 = null; renderMediaPreviewBar();
            }
        }
    </script>
</body>
</html>
