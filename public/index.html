<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RS FLAGS - Chat App</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', 'Consolas', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: #0a0412; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; overflow: hidden; position: relative; }
        #matrix-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.35; pointer-events: none; }

        #auth-screen { z-index: 10; background: rgba(18, 8, 33, 0.95); padding: 30px 20px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; border: 1px solid #b15eff; box-shadow: 0 0 25px rgba(177, 94, 255, 0.35); }
        #auth-screen input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ff5ed1; border-radius: 6px; background: #0a0412; color: #fff; outline: none; font-size: 16px; }
        #auth-screen button { width: 48%; padding: 12px; border: 1px solid #b15eff; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; background: #2a0845; color: #ffffff; text-shadow: 0 0 5px #ff5ed1; font-size: 15px; }

        /* --- EXPANDED CHAT FRAME --- */
        #chat-screen { display: none; z-index: 10; width: 98vw; max-width: 1400px; height: 96vh; height: 96dvh; background: rgba(15, 6, 28, 0.94); border: 1px solid #b15eff; border-radius: 12px; overflow: hidden; flex-direction: row; box-shadow: 0 0 45px rgba(255, 94, 209, 0.3); position: relative; }
        #sidebar { width: 340px; background: rgba(22, 10, 40, 0.95); border-right: 1px solid #3c125d; padding: 15px; display: flex; flex-direction: column; z-index: 20; flex-shrink: 0; }
        .brand-logo { font-size: 1.4em; font-weight: 900; letter-spacing: 2px; text-align: center; border-bottom: 1px dashed #b15eff; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .logo-y { color: #b15eff; text-shadow: 0 0 12px #b15eff; }
        .logo-s { color: #ff5ed1; text-shadow: 0 0 12px #ff5ed1; }

        .my-profile-box { display: flex; flex-direction: column; gap: 6px; padding: 10px; background: rgba(35, 14, 61, 0.6); border: 1px solid #5a1b8e; border-radius: 8px; margin-bottom: 12px; position: relative; }
        .profile-row { display: flex; align-items: center; gap: 10px; }
        .avatar-container { position: relative; width: 44px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; }
        .avatar-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1px solid #ff5ed1; background: #120624; }
        
        .role-badge { display: inline-block; background: #ff5ed1; color: #0a0412; font-size: 0.65em; font-weight: bold; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; margin-left: 4px; }
        .role-owner { background: #ffd700; color: #000; }

        .bio-text { font-size: 0.75em; color: #d0a3ff; font-style: italic; margin-top: 4px; border-top: 1px dashed #3c125d; padding-top: 4px; word-break: break-word; }

        #chat-main { flex: 1; display: flex; flex-direction: column; background: rgba(10, 4, 18, 0.75); width: 100%; height: 100%; position: relative; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        
        /* MESSAGE STYLES WITH DELETE ACTION */
        .msg { background: rgba(35, 14, 61, 0.75); padding: 12px 14px; border-radius: 8px; border: 1px solid #5a1b8e; max-width: 80%; word-break: break-word; color: #ffffff; display: flex; gap: 12px; position: relative; transition: all 0.2s ease; }
        .msg:hover .msg-delete-btn { display: flex; }
        .msg-body { flex: 1; min-width: 0; }
        .msg .author { font-weight: bold; font-size: 0.9em; margin-bottom: 4px; color: #ff5ed1; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        
        .msg-delete-btn { display: none; background: rgba(255, 42, 133, 0.2); border: 1px solid #ff2a85; color: #ff2a85; border-radius: 4px; font-size: 0.7em; padding: 2px 6px; cursor: pointer; align-items: center; justify-content: center; }
        .msg-delete-btn:hover { background: #ff2a85; color: #ffffff; }

        .user-item { padding: 8px 0; border-bottom: 1px solid #2a0845; font-size: 0.85em; color: #d0a3ff; display: flex; flex-direction: column; gap: 4px; }
        .owner-actions { display: flex; gap: 4px; margin-top: 4px; }
        .btn-mini { background: #2a0845; border: 1px solid #b15eff; color: #ff5ed1; font-size: 0.7em; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
        .btn-mini-danger { border-color: #ff2a85; color: #ff2a85; }

        .msg-images-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 8px; max-width: 480px; }
        .chat-img-thumb { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; border: 1px solid #b15eff; cursor: pointer; }
        .chat-media-video { width: 100%; max-width: 420px; border-radius: 8px; border: 1px solid #b15eff; margin-top: 8px; }
        .chat-media-audio { width: 100%; max-width: 340px; margin-top: 8px; outline: none; }

        #media-preview-bar { display: none; padding: 8px 12px; background: rgba(22, 10, 40, 0.95); border-top: 1px solid #3c125d; gap: 10px; overflow-x: auto; align-items: center; }
        .preview-thumb-box { position: relative; width: 55px; height: 55px; flex-shrink: 0; }
        .preview-thumb-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid #ff5ed1; }
        .preview-remove-btn { position: absolute; top: -6px; right: -6px; background: #ff2a85; color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .video-tag-preview { background: #ff5ed1; color: #000; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 0.8em; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

        #input-area { display: flex; padding: 14px; background: rgba(22, 10, 40, 0.95); gap: 10px; align-items: center; border-top: 1px solid #3c125d; }
        #input-area input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 20px; border: 1px solid #b15eff; background: #0a0412; color: #ffffff; outline: none; font-size: 16px; }
        .action-icon-btn { background: #2a0845; border: 1px solid #b15eff; color: #ff5ed1; border-radius: 50%; width: 42px; height: 42px; font-size: 1.2em; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .action-icon-btn.recording { background: #ff2a85; color: #ffffff; border-color: #ff2a85; animation: pulse 1s infinite; }

        /* --- DP EFFECT STYLES --- */
        .dp-effect-none { border-radius: 50%; border: 1px solid #ff5ed1; }
        .dp-effect-neon { border-radius: 50%; border: 2px solid #00ffff; box-shadow: 0 0 12px #00ffff, 0 0 20px #ff00ff; }
        .dp-effect-gold { border-radius: 50%; border: 2px solid #ffd700; box-shadow: 0 0 15px #ffd700; }
        .dp-effect-pulse { border-radius: 50%; border: 2px solid #ff5ed1; animation: dpPulse 1.5s infinite alternate; }
        .dp-effect-glitch { border-radius: 20%; border: 2px solid #ff2a85; box-shadow: -3px 0 #00ffff, 3px 0 #ff00ff; }

        @keyframes dpPulse {
            0% { box-shadow: 0 0 4px #ff5ed1; transform: scale(0.98); }
            100% { box-shadow: 0 0 18px #ff5ed1, 0 0 28px #b15eff; transform: scale(1.05); }
        }

        /* --- PROFILE MODAL STYLES --- */
        #profile-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.8); z-index: 99; justify-content: center; align-items: center; }
        .modal-content { background: #160a28; border: 1px solid #b15eff; border-radius: 12px; width: 90%; max-width: 400px; padding: 20px; box-shadow: 0 0 30px rgba(177, 94, 255, 0.4); display: flex; flex-direction: column; gap: 12px; }
        .modal-content h3 { color: #ff5ed1; border-bottom: 1px dashed #b15eff; padding-bottom: 8px; text-align: center; }
        .modal-field { display: flex; flex-direction: column; gap: 4px; }
        .modal-field label { font-size: 0.8em; color: #b15eff; font-weight: bold; }
        .modal-field input, .modal-field select, .modal-field textarea { background: #0a0412; border: 1px solid #ff5ed1; border-radius: 6px; padding: 8px 10px; color: #fff; outline: none; font-size: 14px; }
        .modal-field textarea { resize: none; height: 60px; }
        .modal-btns { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; }
        .modal-btns button { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #b15eff; font-weight: bold; cursor: pointer; }
        .btn-save { background: #2a0845; color: #fff; }
        .btn-cancel { background: #120624; color: #ff5ed1; border-color: #ff5ed1 !important; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <canvas id="matrix-bg"></canvas>

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen">
        <div class="brand-logo" style="justify-content: center;"><span class="logo-y">Y</span><span class="logo-s">S</span></div>
        <p style="font-size: 0.8em; color: #b15eff; margin: 8px 0 15px 0;">RS FLAGS CHAT</p>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <div style="display: flex; justify-content: space-between; margin-top: 10px;">
            <button onclick="auth('login')">Log In</button>
            <button onclick="auth('register')">Register</button>
        </div>
        <p id="auth-err" style="color: #ff5ed1; font-size: 0.8em; margin-top: 10px;"></p>
    </div>

    <!-- MAIN CHAT SCREEN -->
    <div id="chat-screen">
        <div id="sidebar">
            <div class="brand-logo"><span><span class="logo-y">Y</span><span class="logo-s">S</span> FLAGS</span></div>
            
            <!-- CURRENT USER PROFILE BOX -->
            <div class="my-profile-box">
                <div class="profile-row">
                    <div class="avatar-container">
                        <img id="my-avatar" class="avatar-img dp-effect-none" src="">
                    </div>
                    <div style="flex: 1; min-width: 0;">
                        <div id="my-display-name" style="font-weight:bold; font-size:0.9em; color:#ffffff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Guest</div>
                        <div id="my-username" style="font-size:0.75em; color:#b15eff;">@guest</div>
                        <span id="my-role" class="role-badge">MEMBER</span>
                    </div>
                    <button class="btn-mini" onclick="openProfileModal()" title="Edit Profile">✏️ Edit</button>
                </div>
                <div id="my-bio" class="bio-text">Bio: Hey there!</div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin: 5px 0;">
                <p style="font-size: 0.8em; color: #b15eff;">ONLINE USERS</p>
                <button class="btn-mini-danger btn-mini" onclick="logout()">Logout</button>
            </div>
            <div id="online-list" style="flex: 1; overflow-y: auto;"></div>
        </div>

        <div id="chat-main">
            <div id="messages"></div>

            <div id="media-preview-bar"></div>
            
            <div id="input-area">
                <input type="file" id="multi-image-input" accept="image/*" multiple style="display:none;" onchange="handleImagesSelected(event)">
                <button class="action-icon-btn" onclick="document.getElementById('multi-image-input').click()" title="Attach Images">🖼️</button>

                <input type="file" id="video-input" accept="video/*" style="display:none;" onchange="handleVideoSelect(event)">
                <button class="action-icon-btn" onclick="document.getElementById('video-input').click()" title="Attach Video">🎥</button>

                <button id="mic-btn" class="action-icon-btn" onclick="toggleVoiceRecording()" title="Record Voice Message">🎤</button>

                <input type="text" id="msg-input" placeholder="Type a message..." onkeydown="if(event.key === 'Enter') sendMsg()">
                <button style="background: #2a0845; border: 1px solid #ff5ed1; padding: 12px 20px; color: #ffffff; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 15px;" onclick="sendMsg()">Send</button>
            </div>
        </div>
    </div>

    <!-- PROFILE CUSTOMIZATION MODAL -->
    <div id="profile-modal">
        <div class="modal-content">
            <h3>Custom Profile</h3>

            <div class="modal-field">
                <label>Display Name</label>
                <input type="text" id="edit-display-name" placeholder="Enter new display name">
            </div>

            <div class="modal-field">
                <label>Avatar / DP Image</label>
                <input type="file" id="edit-dp-file" accept="image/*" onchange="handleDpUpload(event)">
            </div>

            <div class="modal-field">
                <label>DP Frame / Glow Effect</label>
                <select id="edit-dp-effect">
                    <option value="dp-effect-none">Classic Circle (None)</option>
                    <option value="dp-effect-neon">Cyber Neon Glow</option>
                    <option value="dp-effect-gold">Gold Aura</option>
                    <option value="dp-effect-pulse">Pulse Wave</option>
                    <option value="dp-effect-glitch">Cyber Glitch Box</option>
                </select>
            </div>

            <div class="modal-field">
                <label>Bio</label>
                <textarea id="edit-bio" placeholder="Write a short bio..."></textarea>
            </div>

            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeProfileModal()">Cancel</button>
                <button class="btn-save" onclick="saveProfileModal()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23b15eff'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

        // Canvas Background Animation
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let drops = Array(Math.floor(canvas.width / 15)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 4, 18, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 15px monospace';
            ctx.fillStyle = '#ff5ed1';
            for (let i = 0; i < drops.length; i++) {
                ctx.fillText('YS', i * 15, drops[i] * 15);
                if (drops[i] * 15 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        const socket = io();
        let currentUser = null;
        let pendingImages = [];
        let pendingVideoBase64 = null;
        let pendingAvatarBase64 = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // --- AUTO-LOGIN / SAVE CREDS ---
        window.addEventListener('load', () => {
            const savedUser = localStorage.getItem('rs_chat_user');
            const savedPass = localStorage.getItem('rs_chat_pass');
            if (savedUser && savedPass) {
                document.getElementById('username').value = savedUser;
                document.getElementById('password').value = savedPass;
                auth('login');
            }
        });

        function auth(action) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (username && password) {
                socket.emit('authenticate', { username, password, action });
            }
        }

        function logout() {
            localStorage.removeItem('rs_chat_user');
            localStorage.removeItem('rs_chat_pass');
            location.reload();
        }

        socket.on('auth_error', (msg) => document.getElementById('auth-err').innerText = msg);

        socket.on('auth_success', (user) => {
            currentUser = user;
            localStorage.setItem('rs_chat_user', document.getElementById('username').value.trim());
            localStorage.setItem('rs_chat_pass', document.getElementById('password').value.trim());

            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            
            updateMyProfileDisplay(user);
        });

        function updateMyProfileDisplay(user) {
            document.getElementById('my-display-name').innerText = user.displayName;
            document.getElementById('my-username').innerText = `@${user.username}`;
            
            const avatarImg = document.getElementById('my-avatar');
            avatarImg.src = user.avatar || DEFAULT_AVATAR;
            avatarImg.className = `avatar-img ${user.dpEffect || 'dp-effect-none'}`;
            
            const roleBadge = document.getElementById('my-role');
            roleBadge.innerText = user.role;
            if (user.role === 'OWNER') roleBadge.classList.add('role-owner');

            document.getElementById('my-bio').innerText = user.bio ? `Bio: ${user.bio}` : 'No bio set...';
        }

        socket.on('kicked', () => {
            alert('You were kicked from the server by the Owner.');
            logout();
        });

        socket.on('role_updated', (newRole) => {
            if (currentUser) currentUser.role = newRole;
            const roleBadge = document.getElementById('my-role');
            roleBadge.innerText = newRole;
            if (newRole === 'OWNER') roleBadge.classList.add('role-owner');
            else roleBadge.classList.remove('role-owner');
        });

        // --- PROFILE MODAL FUNCTIONS ---
        function openProfileModal() {
            if (!currentUser) return;
            document.getElementById('edit-display-name').value = currentUser.displayName || '';
            document.getElementById('edit-bio').value = currentUser.bio || '';
            document.getElementById('edit-dp-effect').value = currentUser.dpEffect || 'dp-effect-none';
            pendingAvatarBase64 = null;
            document.getElementById('profile-modal').style.display = 'flex';
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').style.display = 'none';
        }

        function handleDpUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            compressImage(file, 300, 0.8).then(base64 => {
                pendingAvatarBase64 = base64;
            });
        }

        function saveProfileModal() {
            const newName = document.getElementById('edit-display-name').value.trim();
            const newBio = document.getElementById('edit-bio').value.trim();
            const newDpEffect = document.getElementById('edit-dp-effect').value;

            const payload = {
                displayName: newName || currentUser.username,
                bio: newBio,
                dpEffect: newDpEffect
            };

            if (pendingAvatarBase64) {
                payload.avatar = pendingAvatarBase64;
            }

            socket.emit('update_profile', payload);
            closeProfileModal();
        }

        socket.on('profile_updated', (data) => {
            if (currentUser && data.username === currentUser.username) {
                currentUser.displayName = data.displayName;
                currentUser.avatar = data.avatar;
                currentUser.bio = data.bio;
                currentUser.dpEffect = data.dpEffect;
                updateMyProfileDisplay(currentUser);
            }
        });

        // --- ONLINE LIST & OWNER CONTROLS ---
        socket.on('update_online_list', (usersList) => {
            const list = document.getElementById('online-list');
            list.innerHTML = '';
            usersList.forEach(u => {
                if (currentUser && u.username === currentUser.username) return;
                
                const div = document.createElement('div');
                div.className = 'user-item';

                let roleBadgeClass = u.role === 'OWNER' ? 'role-badge role-owner' : 'role-badge';

                let ownerButtons = '';
                if (currentUser && currentUser.role === 'OWNER' && u.role !== 'OWNER') {
                    ownerButtons = `
                    <div class="owner-actions">
                        <button class="btn-mini" onclick="assignRole('${u.username}')">Give Role</button>
                        <button class="btn-mini btn-mini-danger" onclick="kickUser('${u.username}')">Kick</button>
                    </div>`;
                }

                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:8px;">
                        <img class="avatar-img ${u.dpEffect || 'dp-effect-none'}" style="width:28px; height:28px;" src="${u.avatar || DEFAULT_AVATAR}">
                        <div>
                            <strong>${u.displayName || u.username}</strong> <span class="${roleBadgeClass}">${u.role}</span>
                        </div>
                    </div>
                    <div style="font-size:0.75em; color:#a080c0; padding-left:36px;">${u.bio || 'No bio set'}</div>
                    ${ownerButtons}`;

                list.appendChild(div);
            });
        });

        function kickUser(targetUser) {
            if (confirm(`Kick ${targetUser} from the server?`)) {
                socket.emit('kick_user', targetUser);
            }
        }

        function assignRole(targetUser) {
            const customRole = prompt(`Assign custom role to ${targetUser}:`, "MODERATOR");
            if (customRole !== null && customRole.trim() !== '') {
                socket.emit('assign_role', { targetUsername: targetUser, newRole: customRole.trim().toUpperCase() });
            }
        }

        // --- IMAGE SELECTION & COMPRESSION ---
        function compressImage(file, maxWidth = 1000, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        async function handleImagesSelected(event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;
            const compressed = await Promise.all(files.map(f => compressImage(f)));
            pendingImages.push(...compressed);
            renderMediaPreviewBar();
            event.target.value = '';
        }

        // --- VIDEO SELECTION ---
        function handleVideoSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 30 * 1024 * 1024) {
                alert("Please select a video file under 30MB.");
                return;
            }

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => {
                pendingVideoBase64 = reader.result;
                renderMediaPreviewBar();
            };
            event.target.value = '';
        }

        // --- VOICE RECORDING ---
        async function toggleVoiceRecording() {
            const micBtn = document.getElementById('mic-btn');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            socket.emit('send_message', { audio: reader.result });
                        };
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording');
                } catch (err) {
                    alert("Unable to access microphone.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
            }
        }

        // --- MEDIA PREVIEW BAR ---
        function renderMediaPreviewBar() {
            const bar = document.getElementById('media-preview-bar');
            if (pendingImages.length === 0 && !pendingVideoBase64) {
                bar.style.display = 'none';
                bar.innerHTML = '';
                return;
            }
            bar.style.display = 'flex';
            
            let html = '';
            
            pendingImages.forEach((imgSrc, idx) => {
                html += `
                <div class="preview-thumb-box">
                    <img src="${imgSrc}">
                    <button class="preview-remove-btn" onclick="removePendingImg(${idx})">✕</button>
                </div>`;
            });

            if (pendingVideoBase64) {
                html += `
                <div class="video-tag-preview">
                    🎥 Video Attached 
                    <span style="cursor:pointer; margin-left:6px;" onclick="clearPendingVideo()">✕</span>
                </div>`;
            }

            bar.innerHTML = html;
        }

        function removePendingImg(idx) {
            pendingImages.splice(idx, 1);
            renderMediaPreviewBar();
        }

        function clearPendingVideo() {
            pendingVideoBase64 = null;
            renderMediaPreviewBar();
        }

        // --- REMOVE / DELETE MESSAGE ---
        function deleteMsg(msgId, authorUsername) {
            if (confirm("Remove this message?")) {
                socket.emit('delete_message', { messageId: msgId, authorUsername });
            }
        }

        socket.on('message_deleted', (msgId) => {
            const el = document.getElementById(msgId);
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 200);
            }
        });

        // --- RECEIVE & RENDER MESSAGES ---
        socket.on('receive_message', (data) => {
            const msgBox = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'msg';
            div.id = data.id;

            let mediaContent = '';

            if (data.images && data.images.length > 0) {
                mediaContent += `<div class="msg-images-grid">` +
                    data.images.map(imgSrc => `<img class="chat-img-thumb" src="${imgSrc}" onclick="window.open(this.src)">`).join('') +
                `</div>`;
            }

            if (data.audio) {
                mediaContent += `<div><audio class="chat-media-audio" src="${data.audio}" controls></audio></div>`;
            }

            if (data.video) {
                mediaContent += `<div><video class="chat-media-video" src="${data.video}" controls></video></div>`;
            }

            let roleBadgeClass = data.role === 'OWNER' ? 'role-badge role-owner' : 'role-badge';

            // Show Delete button if current user is author or OWNER
            let deleteBtnHtml = '';
            if (currentUser && (currentUser.username === data.username || currentUser.role === 'OWNER')) {
                deleteBtnHtml = `<button class="msg-delete-btn" onclick="deleteMsg('${data.id}', '${data.username}')" title="Delete Message">🗑️ Remove</button>`;
            }

            div.innerHTML = `
                <img class="avatar-img ${data.dpEffect || 'dp-effect-none'}" src="${data.avatar || DEFAULT_AVATAR}">
                <div class="msg-body">
                    <div class="author">
                        <span>${data.displayName} <span class="${roleBadgeClass}">${data.role}</span></span>
                        <div style="display:flex; align-items:center; gap:8px;">
                            ${deleteBtnHtml}
                            <span style="font-weight:normal; font-size:0.75em; color:#b15eff">${data.time}</span>
                        </div>
                    </div>
                    ${data.text ? `<div>${data.text}</div>` : ''}
                    ${mediaContent}
                </div>`;

            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
        });

        // --- SEND MESSAGE ---
        function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();

            if (text || pendingImages.length > 0 || pendingVideoBase64) {
                socket.emit('send_message', { 
                    text: text,
                    images: pendingImages,
                    video: pendingVideoBase64 
                });

                input.value = '';
                pendingImages = [];
                pendingVideoBase64 = null;
                renderMediaPreviewBar();
            }
        }
    </script>
</body>
</html>
